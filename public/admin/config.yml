# Decap CMS 配置
# 文档: https://decapcms.org/docs/configuration-options/

# ⚠ 2026-08-08 安全审计：已注释。local_backend 只用于本地开发(配合 npx decap-server)，
#   上线时若残留，/admin 页面会在浏览器里尝试连 localhost:8081 的后端写接口，
#   部署环境若恰好有服务监听将形成未鉴权写入面。需要本地开发时取消注释。
# local_backend: true

# GitHub 后端 —— 部署后通过 GitHub OAuth 认证(无需自建登录系统)
backend:
  name: github
  repo: ZeniX-ally/blog        # ← 部署前改成你的实际仓库名
  branch: main                  # ← 分支名，默认 main

# 发布图片的存放位置
# Next.js 中 public/ 下的文件直接以根路径访问
media_folder: "public/images"
public_folder: "/images"

# 文章集合
collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"

    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "date", label: "发布日期", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: "excerpt", label: "摘要", widget: "text", required: false, hint: "一句话概括，显示在文章列表中" }
      - { name: "tags", label: "标签", widget: "list", required: false, hint: "多个标签换行输入" }
      - { name: "draft", label: "草稿", widget: "boolean", default: true, hint: "勾选后文章不会公开显示" }
      - { name: "body", label: "正文", widget: "markdown" }
